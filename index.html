<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PZ IPTV</title>
    <style>
      :root {
        --bg: #0b1220;
        --bg-soft: #111827;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-strong: rgba(17, 24, 39, 0.96);
        --panel-alt: rgba(30, 41, 59, 0.85);
        --border: rgba(148, 163, 184, 0.18);
        --muted: #94a3b8;
        --text: #f8fafc;
        --text-soft: #cbd5e1;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
        --success: #34d399;
        --shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.18), transparent 35%),
          linear-gradient(180deg, var(--bg) 0%, #020817 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 28px;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        font-weight: 800;
        color: #02131d;
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.35);
      }

      .title {
        margin: 0;
        font-size: clamp(1.3rem, 2vw, 2rem);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: min(480px, 70vw);
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      }

      .search-box svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        opacity: 0.8;
      }

      .search-box input {
        flex: 1;
        min-width: 100px;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
      }

      .search-box input::placeholder {
        color: var(--muted);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 12px;
        background: rgba(14, 165, 233, 0.08);
        color: var(--text);
        padding: 11px 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.7);
        background: rgba(14, 165, 233, 0.14);
      }

      .button svg {
        width: 16px;
        height: 16px;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 20px 56px;
      }

      .top-summary {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 26px;
      }

      .summary-text {
        color: var(--text-soft);
        font-size: 0.98rem;
        margin: 0;
      }

      .summary-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.7);
        color: var(--muted);
        font-size: 0.85rem;
      }

      .summary-pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
      }

      .country-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 18px;
      }

      .country-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.96));
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .country-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 18px 12px;
        border-bottom: 1px solid var(--border);
      }

      .country-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .country-meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .copy-btn {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .copy-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.6);
        background: rgba(14, 165, 233, 0.12);
      }

      .copy-btn svg {
        width: 17px;
        height: 17px;
      }

      .channels {
        padding: 12px 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 330px;
        overflow: auto;
      }

      .channel-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 10px;
        background: rgba(30, 41, 59, 0.45);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .channel-name {
        flex: 1;
        min-width: 0;
        color: var(--text-soft);
        font-size: 0.92rem;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .mini-copy {
        appearance: none;
        border: 0;
        background: rgba(56, 189, 248, 0.08);
        border-radius: 8px;
        color: var(--text);
        width: 30px;
        height: 30px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .mini-copy:hover {
        background: rgba(56, 189, 248, 0.16);
      }

      .mini-copy svg {
        width: 14px;
        height: 14px;
      }

      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.48);
      }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(52, 211, 153, 0.4);
        border-radius: 12px;
        color: var(--text);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 760px) {
        .topbar {
          padding: 16px 14px;
          flex-direction: column;
          align-items: stretch;
        }

        .brand-wrap {
          justify-content: center;
        }

        .header-actions {
          width: 100%;
          justify-content: stretch;
        }

        .search-box {
          min-width: 0;
          width: 100%;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-badge">PZ</div>
        <h1 class="title">PZ IPTV</h1>
      </div>

      <div class="header-actions">
        <label class="search-box" aria-label="Hledat země nebo kanál">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.5 18a7.5 7.5 0 1 1 5.303-12.803A7.5 7.5 0 0 1 10.5 18Zm0-2a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Zm9.2 5.2-4.1-4.1 1.4-1.4 4.1 4.1-1.4 1.4Z" fill="currentColor"/>
          </svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Hledej: cz, sk, de, BBC..." />
        </label>

        <button id="copyProjectBtn" class="button" type="button" title="Kopírovat odkaz na celý projekt">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5Zm-4.5 1.5A2.75 2.75 0 0 1 7.25 8.5h2.3v1.25h-2.3A1.5 1.5 0 0 0 5.75 11.25v6.5A1.5 1.5 0 0 0 7.25 19h6.5a1.5 1.5 0 0 0 1.5-1.5v-2.3H14.5v2.3a2.75 2.75 0 0 1-2.75 2.75h-6.5A2.75 2.75 0 0 1 2.5 17.75v-6.5Z" fill="currentColor"/>
          </svg>
          Projekt
        </button>
      </div>
    </header>

    <main>
      <div class="top-summary">
        <p class="summary-text">Vyhledávej země, kódy nebo názvy kanálů a zkopíruj odkaz pro VLC nebo jiné IPTV přehrávače.</p>
        <div class="summary-pill"><span class="dot"></span><span id="summaryCounter">Načítání...</span></div>
      </div>

      <section id="countryGrid" class="country-grid" aria-live="polite"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">Zkopírováno.</div>

    <script>
      const repoOwner = 'ProgramZelva-dev';
      const repoName = 'pziptv';
      const baseApi = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/streams`;
      const projectUrl = 'https://raw.githubusercontent.com/ProgramZelva-dev/pziptv/refs/heads/main/index.m3u';

      const countryNames = {
        cz: 'Česká republika', sk: 'Slovensko', de: 'Německo', fr: 'Francie', it: 'Itálie', es: 'Španělsko', pl: 'Polsko', uk: 'Spojené království', us: 'Spojené státy', ca: 'Kanada', au: 'Austrálie', at: 'Rakousko', nl: 'Nizozemsko', be: 'Belgie', se: 'Švédsko', no: 'Norsko', fi: 'Finsko', cz: 'Česká republika', hr: 'Chorvatsko', hu: 'Maďarsko', ro: 'Rumunsko', bg: 'Bulharsko', gr: 'Řecko', tr: 'Turecko', ae: 'Spojené arabské emiráty', sa: 'Saúdská Arábie', in: 'Indie', jp: 'Japonsko', kr: 'Jižní Korea', cn: 'Čína', tw: 'Tchaj-wan', br: 'Brazílie', ar: 'Argentina', mx: 'Mexiko', cl: 'Chile', pe: 'Peru', co: 'Kolumbie', pt: 'Portugalsko', ru: 'Rusko', ua: 'Ukrajina', by: 'Bělorusko', kz: 'Kazachstán'
      };

      const state = {
        files: [],
        query: ''
      };

      const grid = document.getElementById('countryGrid');
      const searchInput = document.getElementById('searchInput');
      const summaryCounter = document.getElementById('summaryCounter');
      const toast = document.getElementById('toast');

      function showToast(message = 'Zkopírováno.') {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function safeCopy(text, fallbackMessage = 'Zkopírováno.') {
        if (!navigator.clipboard) {
          showToast('Prohlížeč nepodporuje kopírování.');
          return;
        }

        navigator.clipboard.writeText(text)
          .then(() => showToast(fallbackMessage))
          .catch(() => showToast('Kopírování se nezdařilo.'));
      }

      function formatCountryLabel(fileName) {
        const raw = fileName.replace(/\.m3u$/i, '').trim();
        const clean = raw.replace(/[_-].*$/, '');
        const code = clean.toLowerCase();
        return countryNames[code] || raw.toUpperCase();
      }

      function getFileUrl(fileName) {
        return `https://raw.githubusercontent.com/${repoOwner}/${repoName}/refs/heads/main/streams/${fileName}`;
      }

      function parseM3U(content) {
        const lines = (content || '').split(/\r?\n/);
        const channels = [];

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].trim();
          if (!line || line.startsWith('#EXTM3U')) continue;

          if (line.startsWith('#EXTINF')) {
            const match = line.match(/^#EXTINF.*?,\s*(.*)$/i);
            const title = match ? match[1].trim() : 'Neznámý kanál';
            const url = (lines[i + 1] || '').trim();

            if (url && !url.startsWith('#')) {
              channels.push({ title, url });
            }
          }
        }

        return channels;
      }

      function renderCountries() {
        const query = state.query.trim().toLowerCase();

        const filtered = state.files.filter((file) => {
          const label = formatCountryLabel(file.name).toLowerCase();
          const fileCode = file.name.replace(/\.m3u$/i, '').toLowerCase();
          const fileQuery = `${label} ${fileCode}`;

          if (!query) return true;

          if (fileQuery.includes(query)) return true;

          const channels = file.channels || [];
          return channels.some((channel) => (
            channel.title.toLowerCase().includes(query) ||
            channel.url.toLowerCase().includes(query)
          ));
        });

        summaryCounter.textContent = `${filtered.length} zemí / souborů`;

        if (!filtered.length) {
          grid.innerHTML = '<div class="empty">Nic neodpovídá hledání. Zkus „cz“, „sk“, „de“, nebo název kanálu.</div>';
          return;
        }

        grid.innerHTML = filtered.map((file) => {
          const label = formatCountryLabel(file.name);
          const rawUrl = getFileUrl(file.name);
          const channels = (file.channels || []).slice(0, 20);
          const channelMarkup = channels.length ? channels.map((channel) => `
            <div class="channel-item">
              <span class="channel-name">${escapeHtml(channel.title)}</span>
              <button class="mini-copy" type="button" data-copy="${escapeAttribute(channel.url)}" aria-label="Kopírovat ${escapeAttribute(channel.title)}">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5Zm-4.5 1.5A2.75 2.75 0 0 1 7.25 8.5h2.3v1.25h-2.3A1.5 1.5 0 0 0 5.75 11.25v6.5A1.5 1.5 0 0 0 7.25 19h6.5a1.5 1.5 0 0 0 1.5-1.5v-2.3H14.5v2.3a2.75 2.75 0 0 1-2.75 2.75h-6.5A2.75 2.75 0 0 1 2.5 17.75v-6.5Z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          `).join('') : '<div class="channel-item"><span class="channel-name">Žádné kanály nebyly nalezeny.</span></div>';

          return `
            <article class="country-card">
              <div class="country-head">
                <div>
                  <h2 class="country-title">${escapeHtml(label)}</h2>
                  <p class="country-meta">${escapeHtml(file.name)} • ${file.channels.length} kanálů</p>
                </div>
                <button class="copy-btn" type="button" data-copy="${escapeAttribute(rawUrl)}" aria-label="Kopírovat odkaz pro ${escapeAttribute(label)}">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5Zm-4.5 1.5A2.75 2.75 0 0 1 7.25 8.5h2.3v1.25h-2.3A1.5 1.5 0 0 0 5.75 11.25v6.5A1.5 1.5 0 0 0 7.25 19h6.5a1.5 1.5 0 0 0 1.5-1.5v-2.3H14.5v2.3a2.75 2.75 0 0 1-2.75 2.75h-6.5A2.75 2.75 0 0 1 2.5 17.75v-6.5Z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
              <div class="channels">
                ${channelMarkup}
              </div>
            </article>
          `;
        }).join('');

        bindCopyButtons();
      }

      function bindCopyButtons() {
        document.querySelectorAll('[data-copy]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-copy');
            safeCopy(value, 'Odkaz zkopírován.');
          });
        });
      }

      function escapeHtml(value = '') {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttribute(value = '') {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      async function loadStreams() {
        try {
          const response = await fetch(baseApi);
          if (!response.ok) throw new Error('Nepodařilo se načíst seznam streamů.');

          const files = await response.json();
          const m3uFiles = files.filter((entry) => entry.type === 'file' && /\.m3u$/i.test(entry.name));

          const enriched = await Promise.all(m3uFiles.map(async (file) => {
            const text = await fetch(file.download_url).then((r) => r.text());
            return {
              ...file,
              channels: parseM3U(text)
            };
          }));

          state.files = enriched.sort((a, b) => formatCountryLabel(a.name).localeCompare(formatCountryLabel(b.name), 'cs'));
          renderCountries();
        } catch (error) {
          console.error(error);
          grid.innerHTML = '<div class="empty">Nepodařilo se načíst IPTV seznam. Zkontroluj přístup ke GitHub API.</div>';
        }
      }

      searchInput.addEventListener('input', (event) => {
        state.query = event.target.value || '';
        renderCountries();
      });

      document.getElementById('copyProjectBtn').addEventListener('click', () => {
        safeCopy(projectUrl, 'Odkaz na celý projekt zkopírován.');
      });

      loadStreams();
    </script>
  </body>
</html>

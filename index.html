<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PZ IPTV Test</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #f8fafc;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        text-align: center;
        padding: 48px 32px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-bottom: 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PZ IPTV</h1>
      <p>Testovací stránka pro GitHub Pages.</p>
    </div>
  </body>
</html>

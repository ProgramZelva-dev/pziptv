<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PZ IPTV</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --panel-alt: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        --accent: #0ea5e9;
        --accent-soft: rgba(14, 165, 233, 0.08);
        --green: #16a34a;
        --green-soft: rgba(22, 163, 74, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 18px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 10px 0 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: white;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.04em;
        box-shadow: 0 10px 18px rgba(14, 165, 233, 0.22);
      }

      .brand-name {
        font-size: clamp(1.35rem, 2vw, 2.1rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(540px, 62vw);
        min-width: 240px;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }

      .search-wrap svg {
        width: 18px;
        height: 18px;
        fill: var(--muted);
        flex-shrink: 0;
      }

      .search-wrap input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 0.98rem;
      }

      .search-wrap input::placeholder {
        color: var(--muted);
      }

      .primary-btn,
      .ghost-btn,
      .row-btn {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        font-weight: 600;
        font-size: 0.92rem;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .primary-btn:hover,
      .ghost-btn:hover,
      .row-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(14, 165, 233, 0.45);
        box-shadow: 0 8px 20px rgba(14, 165, 233, 0.08);
      }

      .primary-btn {
        background: var(--accent-soft);
        border-color: rgba(14, 165, 233, 0.2);
      }

      .primary-btn,
      .ghost-btn {
        min-height: 44px;
        padding: 0 14px;
      }

      .hero {
        margin-top: 10px;
        margin-bottom: 20px;
        padding: 14px 0 0;
      }

      .hero h2 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1.03rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .stat {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.6);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .stat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 4px var(--green-soft);
      }

      .list {
        margin-top: 24px;
        background: rgba(255,255,255,0.38);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .list-header {
        display: grid;
        grid-template-columns: minmax(160px, 2fr) minmax(90px, 1fr) minmax(170px, 1.2fr);
        gap: 10px;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(248, 250, 252, 0.8);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .country-row {
        display: grid;
        grid-template-columns: minmax(160px, 2fr) minmax(90px, 1fr) minmax(170px, 1.2fr);
        gap: 10px;
        align-items: center;
        padding: 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.75);
      }

      .country-row:last-child {
        border-bottom: 0;
      }

      .country-main {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .country-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 46px;
        height: 32px;
        padding: 0 8px;
        border-radius: 9px;
        background: var(--accent-soft);
        color: #0f3b5a;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .country-name-wrap {
        min-width: 0;
      }

      .country-name {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .country-sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .channel-count {
        font-weight: 700;
        color: var(--muted);
      }

      .row-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .row-btn {
        min-height: 36px;
        padding: 0 12px;
        font-size: 0.83rem;
      }

      .row-btn.primary {
        background: var(--accent-soft);
        border-color: rgba(14, 165, 233, 0.2);
      }

      .empty {
        padding: 30px 18px;
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: rgba(15, 23, 42, 0.96);
        color: white;
        padding: 10px 14px;
        border-radius: 10px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: all 0.2s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 760px) {
        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .top-actions {
          width: 100%;
        }

        .search-wrap {
          width: 100%;
        }

        .list-header {
          display: none;
        }

        .country-row {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 16px;
        }

        .row-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="PZ IPTV">
          <div class="brand-mark">PZ</div>
          <div class="brand-name">PZ IPTV</div>
        </div>

        <div class="top-actions">
          <label class="search-wrap" aria-label="Vyhledávání zemí a kanálů">
            <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.5 18a7.5 7.5 0 1 1 5.3-12.8A7.5 7.5 0 0 1 10.5 18Zm0-2a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Zm9.2 5.2-4.1-4.1 1.4-1.4 4.1 4.1-1.4 1.4Z"/>
            </svg>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Vyhledat země nebo kanál..." />
          </label>

          <button id="copyProjectBtn" class="primary-btn" type="button">Kopírovat projekt</button>
        </div>
      </header>

      <section class="hero">
        <h2>Seznam zemí</h2>
        <p>Vyhledej zemi, státní kód nebo název kanálu a zkopíruj vlastní stream link pro VLC nebo jiný IPTV přehrávač.</p>
        <div class="stats">
          <div class="stat"><span class="stat-dot"></span><span id="countryCount">Načítání...</span></div>
        </div>
      </section>

      <section id="countryList" class="list" aria-live="polite"></section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">Zkopírováno.</div>

    <script>
      const repoOwner = 'ProgramZelva-dev';
      const repoName = 'pziptv';
      const streamsUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/streams`;
      const projectUrl = 'https://raw.githubusercontent.com/ProgramZelva-dev/pziptv/refs/heads/main/index.m3u';

      const state = {
        files: [],
        query: ''
      };

      const countryList = document.getElementById('countryList');
      const searchInput = document.getElementById('searchInput');
      const countryCount = document.getElementById('countryCount');
      const toast = document.getElementById('toast');

      function showToast(message = 'Zkopírováno.') {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function safeCopy(value, message = 'Zkopírováno.') {
        if (!navigator.clipboard) {
          showToast('Prohlížeč nepodporuje kopírování.');
          return;
        }

        navigator.clipboard.writeText(value)
          .then(() => showToast(message))
          .catch(() => showToast('Kopírování selhalo.'));
      }

      function normalizeCountryCode(fileName) {
        const name = fileName.replace(/\.m3u$/i, '').trim();
        if (!name) return 'unknown';
        return name.split('_')[0].split('-')[0].toLowerCase();
      }

      function getCountryLabel(code) {
        const locale = 'cs';
        const labels = {
          ad: 'Andorra', ae: 'Spojené arabské emiráty', af: 'Afghánistán', ag: 'Antigua a Barbuda', al: 'Albánie', am: 'Arménie', ao: 'Angola', ar: 'Argentina', at: 'Rakousko', au: 'Austrálie', aw: 'Aruba', az: 'Ázerbájdžán', ba: 'Bosna a Hercegovina', bb: 'Barbados', bd: 'Bangladéš', be: 'Belgie', bf: 'Burkina Faso', bg: 'Bulharsko', bh: 'Bahrajn', bi: 'Burundi', bj: 'Benin', bm: 'Bermudy', bn: 'Brunej', bo: 'Bolívie', bq: 'Nizozemské Antily', br: 'Brazílie', bs: 'Bahamy', bw: 'Botswana', by: 'Bělorusko', bz: 'Belize', ca: 'Kanada', cd: 'Kongo', cf: 'Středoafrická republika', cg: 'Kongo', ch: 'Švýcarsko', ci: 'Pobřeží slonoviny', cl: 'Chile', cm: 'Kamerun', cn: 'Čína', co: 'Kolumbie', cr: 'Kostarika', cu: 'Kuba', cv: 'Kapverdy', cw: 'Curaçao', cy: 'Kypr', cz: 'Česká republika', de: 'Německo', ee: 'Estonsko', eg: 'Egypt', eh: 'Západní Sahara', er: 'Eritrea', es: 'Španělsko', et: 'Etiopie', fi: 'Finsko', fj: 'Fidži', fo: 'Faerské ostrovy', fr: 'Francie', ga: 'Gabon', ge: 'Gruzie', gf: 'Francouzská Guyana', gh: 'Ghana', gl: 'Grónsko', gm: 'Gambie', gn: 'Guinea', gp: 'Guadeloupe', gq: 'Rovníková Guinea', gt: 'Guatemala', gu: 'Guam', gy: 'Guyana', hk: 'Hongkong', hn: 'Honduras', hr: 'Chorvatsko', ht: 'Haiti', hu: 'Maďarsko', id: 'Indonésie', ie: 'Irsko', il: 'Izrael', in: 'Indie', iq: 'Irák', ir: 'Írán', is: 'Island', it: 'Itálie', jm: 'Jamajka', jo: 'Jordánsko', jp: 'Japonsko', ke: 'Keňa', kg: 'Kyrgyzstán', kh: 'Kambodža', kp: 'Severní Korea', kr: 'Jižní Korea', kw: 'Kuvajt', kz: 'Kazachstán', la: 'Laos', lb: 'Libanon', lc: 'Svatá Lucie', li: 'Lichtenštejnsko', lk: 'Srí Lanka', lr: 'Libérie', lt: 'Litva', lu: 'Lucemburk', lv: 'Lotyšsko', ly: 'Libye', ma: 'Maroko', mc: 'Monako', md: 'Moldavsko', me: 'Černá Hora', mg: 'Madagaskar', mk: 'Severní Makedonie', ml: 'Mali', mm: 'Myanmar', mn: 'Mongolsko', mo: 'Macao', mq: 'Martinik', mr: 'Mauritánie', mt: 'Malta', mu: 'Mauricius', mv: 'Maledivy', mw: 'Malawi', mx: 'Mexiko', my: 'Malajsie', mz: 'Mosambik', na: 'Namibie', nc: 'Nová Kaledonie', ne: 'Niger', ng: 'Nigérie', ni: 'Nikaragua', nl: 'Nizozemsko', no: 'Norsko', np: 'Nepál', nz: 'Nový Zéland', om: 'Omán', pa: 'Panama', pe: 'Peru', pf: 'Francouzská Polynésie', pg: 'Papua Nová Guinea', ph: 'Filipíny', pk: 'Pákistán', pl: 'Polsko', pr: 'Portoriko', ps: 'Palestina', pt: 'Portugalsko', py: 'Paraguay', qa: 'Katar', ro: 'Rumunsko', rs: 'Srbsko', ru: 'Rusko', rw: 'Rwanda', sa: 'Saúdská Arábie', sd: 'Sudán', se: 'Švédsko', sg: 'Singapur', si: 'Slovinsko', sk: 'Slovensko', sl: 'Sierra Leone', sm: 'San Marino', sn: 'Senegal', so: 'Somálsko', sr: 'Surinam', st: 'Svatý Tomáš a Princův ostrov', sv: 'Salvador', sx: 'Svatý Martin', sy: 'Sýrie', td: 'Čad', tg: 'Togo', th: 'Thajsko', tj: 'Tádžikistán', tl: 'Východní Timor', tm: 'Turkmenistán', tn: 'Tunisko', tr: 'Turecko', tt: 'Trinidad a Tobago', tw: 'Tchaj-wan', tz: 'Tanzanie', ua: 'Ukrajina', ug: 'Uganda', uk: 'Spojené království', us: 'Spojené státy', uy: 'Uruguay', uz: 'Uzbekistán', va: 'Vatikán', vc: 'Svatý Vincenc a Grenadiny', ve: 'Venezuela', vg: 'Britské Panenské ostrovy', vi: 'Americké Panenské ostrovy', vn: 'Vietnam', ws: 'Samoa', xk: 'Kosovo', ye: 'Jemen', yt: 'Mayotte', za: 'Jihoafrická republika', zm: 'Zambie', zw: 'Zimbabwe'
        };

        if (labels[code]) return labels[code];

        try {
          const display = new Intl.DisplayNames([locale], { type: 'region' });
          return display.of(code.toUpperCase()) || code.toUpperCase();
        } catch (error) {
          return code.toUpperCase();
        }
      }

      function parseM3U(content) {
        const lines = (content || '').split(/\r?\n/);
        const channels = [];

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].trim();
          if (!line || line.startsWith('#EXTM3U')) continue;

          if (line.startsWith('#EXTINF')) {
            const match = line.match(/^#EXTINF.*?,\s*(.*)$/i);
            const title = match ? match[1].trim() : 'Neznámý kanál';
            const url = (lines[i + 1] || '').trim();
            if (url && !url.startsWith('#')) {
              channels.push({ title, url });
            }
          }
        }

        return channels;
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderCountries() {
        const query = state.query.trim().toLowerCase();

        const rows = state.files
          .filter((entry) => {
            const label = entry.label.toLowerCase();
            const code = entry.code.toUpperCase();
            const combined = `${label} ${code}`;
            if (!query) return true;
            if (combined.includes(query)) return true;
            return entry.channels.some((channel) => {
              return channel.title.toLowerCase().includes(query) || channel.url.toLowerCase().includes(query);
            });
          })
          .sort((a, b) => a.label.localeCompare(b.label, 'cs'));

        countryCount.textContent = `${rows.length} zemí`;

        if (!rows.length) {
          countryList.innerHTML = '<div class="empty">Nic neodpovídá hledání. Zkuste „cz“, „sk“, „de“ nebo název kanálu.</div>';
          return;
        }

        countryList.innerHTML = `
          <div class="list-header">
            <div>Země</div>
            <div>Kanály</div>
            <div>Akce</div>
          </div>
          ${rows.map((item) => {
            const rawUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/refs/heads/main/streams/${item.name}`;
            const preview = item.channels.slice(0, 3);
            const hint = preview.length ? preview.map((channel) => escapeHtml(channel.title)).join(', ') : 'Žádné kanály';
            return `
              <article class="country-row" data-code="${escapeHtml(item.code)}">
                <div class="country-main">
                  <span class="country-code">${escapeHtml(item.code.toUpperCase())}</span>
                  <div class="country-name-wrap">
                    <p class="country-name">${escapeHtml(item.label)}</p>
                    <p class="country-sub">${escapeHtml(item.name)}</p>
                  </div>
                </div>
                <div class="channel-count">${item.channels.length}</div>
                <div class="row-actions">
                  <button class="row-btn primary" type="button" data-copy="${escapeHtml(rawUrl)}">Kopírovat URL</button>
                  <button class="row-btn" type="button" data-copy="${escapeHtml(item.channels[0]?.url || rawUrl)}" title="${escapeHtml(hint)}">První kanál</button>
                </div>
              </article>
            `;
          }).join('')}
        `;

        countryList.querySelectorAll('[data-copy]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-copy');
            safeCopy(value, 'Odkaz zkopírován.');
          });
        });
      }

      async function loadStreams() {
        try {
          const response = await fetch(streamsUrl);
          if (!response.ok) throw new Error('Chyba při načtení dat.');

          const files = await response.json();
          const m3uFiles = files.filter((item) => item.type === 'file' && /\.m3u$/i.test(item.name));

          const enriched = await Promise.all(m3uFiles.map(async (file) => {
            const fileUrl = file.download_url;
            const text = await fetch(fileUrl).then((res) => res.text());
            const channels = parseM3U(text);
            const code = normalizeCountryCode(file.name);
            const label = getCountryLabel(code);
            return {
              ...file,
              code,
              label,
              channels
            };
          }));

          state.files = enriched.filter((entry) => entry.code && entry.code !== 'unknown');
          renderCountries();
        } catch (error) {
          console.error(error);
          countryList.innerHTML = '<div class="empty">Nepodařilo se načíst seznam zemí. Zkontrolujte přístup k repozitáři.</div>';
        }
      }

      searchInput.addEventListener('input', (event) => {
        state.query = event.target.value || '';
        renderCountries();
      });

      document.getElementById('copyProjectBtn').addEventListener('click', () => {
        safeCopy(projectUrl, 'Projektový link zkopírován.');
      });

      loadStreams();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PZ IPTV</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #101827;
        --panel: rgba(15, 23, 42, 0.92);
        --panel-strong: rgba(17, 24, 39, 0.98);
        --panel-soft: rgba(30, 41, 59, 0.8);
        --border: rgba(148, 163, 184, 0.18);
        --text: #f8fafc;
        --text-soft: #dbe4f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --success: #34d399;
        --shadow: 0 16px 40px rgba(2, 6, 23, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 18px 72px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 4px 0 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: #031a29;
        font-weight: 900;
        box-shadow: 0 12px 28px rgba(59, 130, 246, 0.35);
      }

      .brand-name {
        font-size: clamp(1.4rem, 2.4vw, 2.2rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(560px, 62vw);
        min-width: 220px;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      }

      .search-wrap svg {
        width: 18px;
        height: 18px;
        fill: var(--muted);
        flex-shrink: 0;
      }

      .search-wrap input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 0.98rem;
      }

      .search-wrap input::placeholder {
        color: var(--muted);
      }

      .primary-btn,
      .copy-btn,
      .mini-btn {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.78);
        color: var(--text);
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .primary-btn:hover,
      .copy-btn:hover,
      .mini-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.55);
        background: rgba(35, 72, 103, 0.36);
      }

      .primary-btn {
        min-height: 42px;
        padding: 0 14px;
        font-weight: 700;
      }

      .hero {
        margin: 8px 0 18px;
      }

      .hero h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(15, 23, 42, 0.62);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .stat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.16);
      }

      .country-list {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .country-item {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .country-item summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 18px;
        cursor: pointer;
        user-select: none;
      }

      .country-item summary::-webkit-details-marker {
        display: none;
      }

      .country-summary-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        flex: 1;
      }

      .country-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        height: 34px;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: #bae6fd;
        font-weight: 800;
        letter-spacing: 0.08em;
        font-size: 0.76rem;
      }

      .country-meta {
        min-width: 0;
      }

      .country-name {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .country-file {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .country-summary-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .count-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 86px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text-soft);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .copy-btn {
        min-height: 34px;
        padding: 0 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .country-item[open] summary {
        border-bottom: 1px solid var(--border);
      }

      .channel-list {
        padding: 12px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .channel-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .channel-title {
        color: var(--text-soft);
        font-size: 0.95rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .mini-btn {
        min-height: 30px;
        padding: 0 10px;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .empty {
        padding: 28px 18px;
        border: 1px dashed var(--border);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.6);
        color: var(--muted);
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid var(--border);
        color: var(--text);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 760px) {
        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .top-actions {
          width: 100%;
        }

        .search-wrap {
          width: 100%;
        }

        .country-item summary {
          flex-direction: column;
          align-items: stretch;
        }

        .country-summary-right {
          justify-content: space-between;
        }

        .channel-item {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="PZ IPTV">
          <div class="brand-mark">PZ</div>
          <div class="brand-name">PZ IPTV</div>
        </div>

        <div class="top-actions">
          <label class="search-wrap" aria-label="Hledat země nebo kanál">
            <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.5 18a7.5 7.5 0 1 1 5.3-12.8A7.5 7.5 0 0 1 10.5 18Zm0-2a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Zm9.2 5.2-4.1-4.1 1.4-1.4 4.1 4.1-1.4 1.4Z"/>
            </svg>
            <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Zadej country code, země nebo název programu..." />
          </label>

          <button id="copyProjectBtn" class="primary-btn" type="button">Kopírovat projekt</button>
        </div>
      </header>

      <section class="hero">
        <h2>Seznam zemí</h2>
        <p>Zadej country code, název země nebo název programu. Při hledání programu se zobrazí odpovídající země a rozbalený seznam shodných programů.</p>
        <div class="stats">
          <div class="stat"><span class="stat-dot"></span><span id="countryCount">Načítání...</span></div>
        </div>
      </section>

      <section id="countryList" class="country-list" aria-live="polite"></section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">Zkopírováno.</div>

    <script>
      const repoOwner = 'ProgramZelva-dev';
      const repoName = 'pziptv';
      const streamsApiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/streams`;
      const projectUrl = 'https://raw.githubusercontent.com/ProgramZelva-dev/pziptv/refs/heads/main/index.m3u';

      const state = {
        files: [],
        query: ''
      };

      const countryList = document.getElementById('countryList');
      const searchInput = document.getElementById('searchInput');
      const countryCount = document.getElementById('countryCount');
      const toast = document.getElementById('toast');

      function normalizeText(value = '') {
        return String(value)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      function showToast(message = 'Zkopírováno.') {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function safeCopy(value, message = 'Zkopírováno.') {
        if (!navigator.clipboard) {
          showToast('Prohlížeč nepodporuje kopírování.');
          return;
        }

        navigator.clipboard.writeText(value)
          .then(() => showToast(message))
          .catch(() => showToast('Kopírování selhalo.'));
      }

      function normalizeCountryCode(fileName) {
        const raw = fileName.replace(/\.m3u$/i, '').trim();
        if (!raw) return 'unknown';
        return raw.split('_')[0].split('-')[0].toLowerCase();
      }

      const countryLabels = {
        ad: 'Andorra', ae: 'Spojené arabské emiráty', af: 'Afghánistán', ag: 'Antigua a Barbuda', al: 'Albánie', am: 'Arménie', ao: 'Angola', ar: 'Argentina', at: 'Rakousko', au: 'Austrálie', az: 'Ázerbájdžán', ba: 'Bosna a Hercegovina', bb: 'Barbados', bd: 'Bangladéš', be: 'Belgie', bf: 'Burkina Faso', bg: 'Bulharsko', bh: 'Bahrajn', bi: 'Burundi', bj: 'Benin', bo: 'Bolívie', br: 'Brazílie', bs: 'Bahamy', bt: 'Bhútán', bw: 'Botswana', by: 'Bělorusko', bz: 'Belize', ca: 'Kanada', cd: 'Kongo', cf: 'Středoafrická republika', cg: 'Kongo', ch: 'Švýcarsko', ci: 'Pobřeží slonoviny', cl: 'Chile', cm: 'Kamerun', cn: 'Čína', co: 'Kolumbie', cr: 'Kostarika', cu: 'Kuba', cv: 'Kapverdy', cy: 'Kypr', cz: 'Česká republika', de: 'Německo', dk: 'Dánsko', do: 'Dominikánská republika', dz: 'Alžírsko', ec: 'Ekvádor', ee: 'Estonsko', eg: 'Egypt', el: 'Řecko', es: 'Španělsko', et: 'Etiopie', fi: 'Finsko', fr: 'Francie', gb: 'Spojené království', ge: 'Gruzie', gh: 'Ghana', gl: 'Grónsko', gm: 'Gambie', gr: 'Řecko', gt: 'Guatemala', gw: 'Guinea-Bissau', gy: 'Guyana', hk: 'Hongkong', hn: 'Honduras', hr: 'Chorvatsko', ht: 'Haiti', hu: 'Maďarsko', id: 'Indonésie', ie: 'Irsko', il: 'Izrael', in: 'Indie', iq: 'Irák', ir: 'Írán', is: 'Island', it: 'Itálie', jm: 'Jamajka', jo: 'Jordánsko', jp: 'Japonsko', ke: 'Keňa', kg: 'Kyrgyzstán', kh: 'Kambodža', kp: 'Severní Korea', kr: 'Jižní Korea', kw: 'Kuvajt', kz: 'Kazachstán', la: 'Laos', lb: 'Libanon', lc: 'Svatá Lucie', li: 'Lichtenštejnsko', lk: 'Srí Lanka', ls: 'Lesotho', lt: 'Litva', lu: 'Lucembursko', lv: 'Lotyšsko', ly: 'Libye', ma: 'Maroko', mc: 'Monako', md: 'Moldavsko', me: 'Černá Hora', mg: 'Madagaskar', mk: 'Severní Makedonie', ml: 'Mali', mm: 'Myanmar', mn: 'Mongolsko', mr: 'Mauritánie', mt: 'Malta', mu: 'Mauricius', mv: 'Maledivy', mw: 'Malawi', mx: 'Mexiko', my: 'Malajsie', mz: 'Mosambik', na: 'Namibie', ne: 'Niger', ng: 'Nigérie', ni: 'Nikaragua', nl: 'Nizozemsko', no: 'Norsko', np: 'Nepál', nz: 'Nový Zéland', om: 'Omán', pa: 'Panama', pe: 'Peru', pg: 'Papua Nová Guinea', ph: 'Filipíny', pk: 'Pakistan', pl: 'Polsko', pt: 'Portugalsko', py: 'Paraguay', qa: 'Katar', ro: 'Rumunsko', rs: 'Srbsko', ru: 'Rusko', rw: 'Rwanda', sa: 'Saúdská Arábie', sc: 'Seychely', sd: 'Sudán', se: 'Švédsko', sg: 'Singapur', si: 'Slovinsko', sk: 'Slovensko', sn: 'Senegal', so: 'Somálsko', sr: 'Surinam', ss: 'Jižní Súdán', st: 'Svatý Tomáš a Princův ostrov', sv: 'Salvador', sy: 'Sýrie', sz: 'Svazijsko', td: 'Čad', tg: 'Togo', th: 'Thajsko', tj: 'Tádžikistán', tm: 'Turkmenistán', tn: 'Tunisko', to: 'Tonga', tr: 'Turecko', tt: 'Trinidad a Tobago', tw: 'Tchaj-wan', tz: 'Tanzanie', ua: 'Ukrajina', ug: 'Uganda', us: 'Spojené státy americké', uy: 'Uruguay', uz: 'Uzbekistán', ve: 'Venezuela', vn: 'Vietnam', ye: 'Jemen', za: 'Jihoafrická republika', zm: 'Zambie', zw: 'Zimbabwe',
      };

      function getCountryLabel(code) {
        return countryLabels[code] || code.toUpperCase();
      }

      function parseM3U(content) {
        const lines = (content || '').split(/\r?\n/);
        const channels = [];

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].trim();
          if (!line || line.startsWith('#EXTM3U')) continue;

          if (line.startsWith('#EXTINF')) {
            const match = line.match(/^#EXTINF.*?,\s*(.*)$/i);
            const title = match ? match[1].trim() : 'Neznámý kanál';
            const url = (lines[i + 1] || '').trim();
            if (url && !url.startsWith('#')) {
              channels.push({ title, url });
            }
          }
        }

        return channels;
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function matchesCountryQuery(entry, query) {
        if (!query) return true;

        return [entry.code, entry.label, entry.name, getCountryLabel(entry.code)]
          .some((value) => normalizeText(value).includes(query));
      }

      function getMatchingChannels(entry, query) {
        if (!query) return entry.channels;

        return entry.channels.filter((channel) => {
          const haystacks = [channel.title, channel.url];
          return haystacks.some((value) => normalizeText(value).includes(query));
        });
      }

      function renderCountries() {
        const query = normalizeText(state.query);

        let filtered = [];

        if (!query) {
          filtered = state.files.map((entry) => ({ ...entry, visibleChannels: entry.channels }));
        } else {
          const countryCodeMatch = state.files.some((entry) => normalizeText(entry.code).startsWith(query) || normalizeText(entry.code) === query);
          const countryLabelMatch = state.files.some((entry) => normalizeText(entry.label).includes(query));
          const channelMatch = state.files.some((entry) => entry.channels.some((channel) => normalizeText(channel.title).includes(query)));
          const isCountrySearch = countryCodeMatch || (countryLabelMatch && !channelMatch);

          if (isCountrySearch) {
            filtered = state.files
              .filter((entry) => matchesCountryQuery(entry, query))
              .map((entry) => ({ ...entry, visibleChannels: entry.channels }));
          } else {
            filtered = state.files
              .map((entry) => {
                const visibleChannels = getMatchingChannels(entry, query);
                if (!visibleChannels.length) return null;
                return { ...entry, visibleChannels };
              })
              .filter(Boolean);
          }
        }

        countryCount.textContent = `${filtered.length} zemí`;

        if (!filtered.length) {
          countryList.innerHTML = '<div class="empty">Nic neodpovídá hledání. Zkus country code jako „cz“, „sk“, „de“ nebo název programu.</div>';
          return;
        }

        countryList.innerHTML = filtered.map((item) => {
          const rawUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/refs/heads/main/streams/${item.name}`;
          const visibleChannels = item.visibleChannels || item.channels;

          return `
            <details class="country-item" ${query ? 'open' : ''}>
              <summary>
                <div class="country-summary-left">
                  <span class="country-code">${escapeHtml(item.code.toUpperCase())}</span>
                  <div class="country-meta">
                    <p class="country-name">${escapeHtml(item.label)}</p>
                    <div class="country-file">${escapeHtml(item.name)}</div>
                  </div>
                </div>

                <div class="country-summary-right">
                  <span class="count-pill">${visibleChannels.length} kanálů</span>
                  <button class="copy-btn" type="button" data-copy="${escapeHtml(rawUrl)}">URL</button>
                </div>
              </summary>

              <div class="channel-list">
                ${visibleChannels.map((channel) => `
                  <div class="channel-item">
                    <span class="channel-title">${escapeHtml(channel.title)}</span>
                    <button class="mini-btn" type="button" data-copy="${escapeHtml(channel.url)}">Kopírovat</button>
                  </div>
                `).join('')}
              </div>
            </details>
          `;
        }).join('');

        countryList.querySelectorAll('[data-copy]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            const value = button.getAttribute('data-copy');
            safeCopy(value, 'Odkaz zkopírován.');
          });
        });
      }

      async function loadStreams() {
        try {
          const response = await fetch(streamsApiUrl);
          if (!response.ok) throw new Error('Nepodařilo se načíst seznam souborů.');

          const files = await response.json();
          const m3uFiles = files.filter((item) => item.type === 'file' && /\.m3u$/i.test(item.name));

          const enriched = await Promise.all(m3uFiles.map(async (file) => {
            const text = await fetch(file.download_url).then((res) => res.text());
            const code = normalizeCountryCode(file.name);
            return {
              ...file,
              code,
              label: getCountryLabel(code),
              channels: parseM3U(text)
            };
          }));

          state.files = enriched.filter((entry) => !!entry.code && entry.code !== 'unknown');
          renderCountries();
        } catch (error) {
          console.error(error);
          countryList.innerHTML = '<div class="empty">Nepodařilo se načíst seznam zemí. Zkontrolujte přístup k GitHub repozitáři.</div>';
        }
      }

      searchInput.addEventListener('input', (event) => {
        state.query = event.target.value || '';
        renderCountries();
      });

      document.getElementById('copyProjectBtn').addEventListener('click', () => {
        safeCopy(projectUrl, 'Projektový odkaz zkopírován.');
      });

      loadStreams();
    </script>
  </body>
</html>
